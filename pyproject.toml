[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eml2html"
version = "2.7.0"
description = "Convertisseur de fichiers EML en HTML autonome : images inline en base64, sanitization active par défaut, extraction des pièces jointes"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Romain BEAL" },
]
keywords = ["eml", "html", "email", "converter", "mime"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Baebibelab/eml_to_html"
Issues = "https://github.com/Baebibelab/eml_to_html/issues"
Changelog = "https://github.com/Baebibelab/eml_to_html/blob/main/CHANGELOG.md"

[project.scripts]
eml2html = "eml_to_html:main"
eml-to-html = "eml_to_html:main"

[tool.setuptools]
py-modules = ["eml_to_html"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "RUF"]
ignore = [
    "UP006",  # typing.List/Dict -> list/dict : non disponible avant Python 3.9
    "UP007",  # Optional[X] -> X | None : non disponible avant Python 3.10
    "RUF012",  # ClassVar mutable : déjà géré via frozenset/compiled patterns
]

[tool.pytest.ini_options]
testpaths = ["tests"]
